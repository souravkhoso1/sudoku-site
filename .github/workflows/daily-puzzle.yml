name: Generate daily sudoku puzzle

on:
  schedule:
    # Runs at 00:05 UTC every day, shortly after the new UTC date begins.
    - cron: "5 0 * * *"
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate today's puzzle (and next 2 days as a buffer)
        run: node scripts/generate-daily-puzzle.js --days-ahead 2

      - name: Commit new puzzle files
        run: |
          git config user.name "sudoku-bot"
          git config user.email "actions@users.noreply.github.com"
          git add puzzles/
          if git diff --cached --quiet; then
            echo "No new puzzles to commit."
          else
            git commit -m "Add daily puzzle(s)"
            git push
          fi
